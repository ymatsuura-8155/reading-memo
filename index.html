<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive HTML 読書メモ Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* スプリットバー＆レイアウトスタイル */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col font-sans overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center shadow-md z-10">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-book-open text-amber-400 text-xl"></i>
      <h1 class="font-bold text-lg tracking-wide">Drive HTML 読書メモ</h1>
      <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">Canvas WebApp</span>
    </div>

    <!-- コントロールボタン群 -->
    <div class="flex items-center space-x-3 text-sm">
      <button id="btn-load-drive" onclick="loadDriveFileMock()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg flex items-center space-x-2 transition shadow">
        <i class="fa-brands fa-google-drive"></i>
        <span>Driveから開く</span>
      </button>

      <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg flex items-center space-x-2 cursor-pointer border border-slate-700 transition">
        <i class="fa-solid fa-file-arrow-up text-emerald-400"></i>
        <span>ローカルHTML選択</span>
        <input type="file" id="local-file-input" accept=".html,.htm" class="hidden" onchange="handleLocalFile(event)">
      </label>

      <div class="h-4 w-px bg-slate-700 mx-1"></div>

      <button onclick="exportNotesMarkdown()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg flex items-center space-x-1.5 transition">
        <i class="fa-solid fa-download"></i>
        <span>Markdown出力</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ (左右2カラム) -->
  <main class="flex-1 flex overflow-hidden">

    <!-- 左カラム: HTML プレビューエリア -->
    <section class="w-1/2 flex flex-col border-r border-slate-300 bg-white relative">
      <div class="bg-slate-50 border-b border-slate-200 px-4 py-2 flex justify-between items-center text-xs text-slate-600">
        <div class="flex items-center space-x-2 truncate">
          <i class="fa-solid fa-file-code text-blue-500"></i>
          <span id="current-filename" class="font-medium truncate">サンプル本（サンプルを表示中）</span>
        </div>
        <div class="flex items-center space-x-2 text-slate-400">
          <span>※本文のテキストを選択すると右側に自動セットされます</span>
        </div>
      </div>

      <!-- iframe 表示領域 -->
      <div class="flex-1 relative bg-white">
        <iframe id="html-viewer" class="w-full h-full border-none" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </section>

    <!-- 右カラム: 抜書き＆コメントメモエリア -->
    <section class="w-1/2 flex flex-col bg-slate-50 overflow-y-auto">
      <div class="p-5 max-w-2xl mx-auto w-full space-y-6">

        <!-- 新規メモ作成カード -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
          <h2 class="font-bold text-slate-800 text-base flex items-center space-x-2">
            <i class="fa-solid fa-pen-to-square text-indigo-500"></i>
            <span>新しいメモを作成</span>
          </h2>

          <!-- 抜書きテキスト領域 -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">
              抜書き（引用箇所）<span class="text-xs font-normal text-amber-600 ml-2">※HTML内でドラッグ選択すると同期されます</span>
            </label>
            <div class="relative">
              <textarea id="excerpt-input" rows="3" placeholder="左側のHTMLでテキストを選択するか、直接ここに入力してください..." class="w-full text-sm p-3 bg-amber-50/50 border border-amber-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/50 leading-relaxed text-slate-700"></textarea>
              <button onclick="clearExcerpt()" class="absolute top-2 right-2 text-slate-400 hover:text-slate-600 text-xs px-1.5 py-0.5 rounded bg-amber-100/50">
                クリア
              </button>
            </div>
          </div>

          <!-- コメント入力領域 -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">自分のコメント・感想</label>
            <textarea id="comment-input" rows="3" placeholder="重要な理由、疑問、自分のアイデアなどを記入..." class="w-full text-sm p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/50 leading-relaxed"></textarea>
          </div>

          <!-- タグ・ページ番号等 -->
          <div class="flex space-x-3">
            <div class="w-1/2">
              <label class="block text-xs font-semibold text-slate-500 mb-1">章 / 節 / 参照先</label>
              <input type="text" id="chapter-input" placeholder="例: 第2章 パラダイムの転換" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div class="w-1/2">
              <label class="block text-xs font-semibold text-slate-500 mb-1">タグ (カンマ区切り)</label>
              <input type="text" id="tags-input" placeholder="例: 思考法, 重要" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
          </div>

          <!-- 保存ボタン -->
          <button onclick="saveNote()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition shadow-sm flex items-center justify-center space-x-2">
            <i class="fa-solid fa-bookmark"></i>
            <span>メモを保存する</span>
          </button>
        </div>

        <!-- 保存されたメモ一覧 -->
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-slate-700 text-sm flex items-center space-x-2">
              <i class="fa-solid fa-list-ul text-slate-500"></i>
              <span>保存したメモ一覧</span>
              <span id="notes-count" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
            </h3>
            <button onclick="clearAllNotes()" class="text-xs text-rose-500 hover:underline">すべて削除</button>
          </div>

          <div id="notes-list" class="space-y-3">
            <!-- JavaScriptで保存済みメモがここに挿入されます -->
          </div>
        </div>

      </div>
    </section>

  </main>

  <script>
    // --- 1. サンプルコンテンツ＆初期化 ---
    const sampleHTML = `
      <!DOCTYPE html>
      <html lang="ja">
      <head>
        <meta charset="UTF-8">
        <style>
          body { font-family: sans-serif; line-height: 1.8; color: #1e293b; padding: 25px; max-width: 680px; margin: 0 auto; }
          h1 { color: #0f172a; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; margin-top: 0; }
          h2 { color: #1e293b; margin-top: 24px; font-size: 1.25rem; }
          p { margin-bottom: 16px; text-align: justify; }
          blockquote { border-left: 4px solid #cbd5e1; padding-left: 12px; color: #475569; margin: 16px 0; font-style: italic; }
          .highlight { background-color: #fef08a; }
        </style>
      </head>
      <body>
        <h1>サンプル書籍：知的生産の技術（プレビュー）</h1>
        <h2>第1章 情報を収集する意義</h2>
        <p>文章を読むとき、私たちは単に文字を追っているのではない。著者の思考のフレームワークを自らの脳内に再現し、それを自分自身の経験や知識と照合する作業を行っているのだ。</p>
        <p>重要なテキストに出会ったときは、積極的に「抜書き」を行い、その時に生じた自分自身のインスピレーションや疑問を書き留めておくことが極めて重要である。記録されない思考は、一瞬の間に雲散霧消してしまうからだ。</p>
        <h2>第2章 アウトプットへのつなげ方</h2>
        <p>読書メモを効果的な知識データベースに変える鍵は、引用（抜書き）と個人の見解（コメント）を明確に分離して保存することにある。引用は客観的な事実であり、コメントは主体的な創造の芽である。</p>
        <p>この二つが対になって保存されたメモ群は、将来新しいアイデアを組み立てる際の強力な構成要素（ビルディングブロック）となる。</p>
      </body>
      </html>
    `;

    let currentNotes = JSON.parse(localStorage.getItem('reading_notes') || '[]');

    window.addEventListener('DOMContentLoaded', () => {
      // サンプルHTMLをiframeにセット
      setIframeContent(sampleHTML);
      renderNotes();
    });

    // --- 2. iframeへのHTMLセットと選択テキスト監視 ---
    function setIframeContent(htmlText) {
      const iframe = document.getElementById('html-viewer');
      iframe.srcdoc = htmlText;

      // iframeのロード完了後に選択イベントをハンドリング
      iframe.onload = () => {
        try {
          const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
          
          iframeDoc.addEventListener('mouseup', () => {
            const selectedText = iframeDoc.getSelection().toString().trim();
            if (selectedText) {
              document.getElementById('excerpt-input').value = selectedText;
            }
          });
        } catch (e) {
          console.warn('iframeのクロスドメイン制限により直接選択取得ができない場合があります。', e);
        }
      };
    }

    // --- 3. Google Drive / ローカルファイルの読み込み ---
    function handleLocalFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('current-filename').textContent = file.name;

      const reader = new FileReader();
      reader.onload = (e) => {
        setIframeContent(e.target.result);
      };
      reader.readAsText(file);
    }

    function loadDriveFileMock() {
      // 本来は Google Picker API を使用してファイルを選択します
      alert("【Google Drive API 連携デモ】\n実際の実装では、ここで Google Picker API のダイアログが立ち上がり、Drive内のHTMLを選択できます。");
    }

    // --- 4. メモの保存・表示・管理機能 ---
    function saveNote() {
      const excerpt = document.getElementById('excerpt-input').value.trim();
      const comment = document.getElementById('comment-input').value.trim();
      const chapter = document.getElementById('chapter-input').value.trim();
      const tagsStr = document.getElementById('tags-input').value.trim();

      if (!excerpt && !comment) {
        alert('「抜書き」または「コメント」のいずれかを入力してください。');
        return;
      }

      const note = {
        id: Date.now(),
        excerpt: excerpt,
        comment: comment,
        chapter: chapter,
        tags: tagsStr ? tagsStr.split(',').map(t => t.trim()) : [],
        filename: document.getElementById('current-filename').textContent,
        createdAt: new Date().toLocaleString('ja-JP')
      };

      currentNotes.unshift(note);
      localStorage.setItem('reading_notes', JSON.stringify(currentNotes));

      // フォームリセット
      document.getElementById('excerpt-input').value = '';
      document.getElementById('comment-input').value = '';

      renderNotes();
    }

    function renderNotes() {
      const container = document.getElementById('notes-list');
      document.getElementById('notes-count').textContent = currentNotes.length;

      if (currentNotes.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-xs bg-white rounded-lg border border-dashed border-slate-300">
            まだ保存されたメモはありません。
          </div>
        `;
        return;
      }

      container.innerHTML = currentNotes.map(note => `
        <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm space-y-2 relative group hover:border-slate-300 transition">
          <div class="flex justify-between items-start text-xs text-slate-400 mb-1">
            <span class="font-medium text-slate-600">${escapeHtml(note.chapter || '章指定なし')}</span>
            <span>${note.createdAt}</span>
          </div>

          ${note.excerpt ? `
            <blockquote class="bg-amber-50/60 border-l-3 border-amber-400 p-2.5 rounded text-xs text-slate-700 leading-relaxed italic">
              "${escapeHtml(note.excerpt)}"
            </blockquote>
          ` : ''}

          ${note.comment ? `
            <p class="text-xs text-slate-800 leading-relaxed font-normal pt-1">
              ${escapeHtml(note.comment)}
            </p>
          ` : ''}

          ${note.tags && note.tags.length > 0 ? `
            <div class="flex flex-wrap gap-1 pt-1">
              ${note.tags.map(tag => `<span class="bg-slate-100 text-slate-600 text-[10px] px-1.5 py-0.5 rounded">${escapeHtml(tag)}</span>`).join('')}
            </div>
          ` : ''}

          <button onclick="deleteNote(${note.id})" class="absolute top-2 right-2 text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition text-xs p-1">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    function deleteNote(id) {
      if (confirm('このメモを削除してもよろしいですか？')) {
        currentNotes = currentNotes.filter(n => n.id !== id);
        localStorage.setItem('reading_notes', JSON.stringify(currentNotes));
        renderNotes();
      }
    }

    function clearAllNotes() {
      if (confirm('すべての読書メモを削除しますか？この操作は取り消せません。')) {
        currentNotes = [];
        localStorage.removeItem('reading_notes');
        renderNotes();
      }
    }

    function clearExcerpt() {
      document.getElementById('excerpt-input').value = '';
    }

    // --- 5. Markdown エクスポート機能 ---
    function exportNotesMarkdown() {
      if (currentNotes.length === 0) {
        alert('出力するメモがありません。');
        return;
      }

      let md = `# 読書メモ エクスポート\n\n`;
      md += `*出力日時: ${new Date().toLocaleString('ja-JP')}*\n\n---\n\n`;

      currentNotes.forEach((note, index) => {
        md += `### メモ #${currentNotes.length - index} ${note.chapter ? `(${note.chapter})` : ''}\n`;
        md += `- **参照ファイル**: ${note.filename}\n`;
        md += `- **記録日時**: ${note.createdAt}\n`;
        if (note.tags.length > 0) md += `- **タグ**: ${note.tags.join(', ')}\n`;
        md += `\n`;

        if (note.excerpt) {
          md += `> ${note.excerpt.replace(/\n/g, '\n> ')}\n\n`;
        }

        if (note.comment) {
          md += `**コメント:**\n${note.comment}\n\n`;
        }

        md += `---\n\n`;
      });

      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reading_notes_${new Date().toISOString().slice(0, 10)}.md`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
